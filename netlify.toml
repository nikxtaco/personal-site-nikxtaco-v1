[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # react-scripts 4 / webpack 4 need the legacy OpenSSL provider on Node 17+
  NODE_VERSION = "18"
  NODE_OPTIONS = "--openssl-legacy-provider"
  # don't fail the build on ESLint warnings (react-scripts treats CI warnings as errors)
  CI = "false"

# Serve the inline resume page (live Google Drive embed) at a clean /resume.pdf URL.
# status 200 = rewrite (URL stays /resume.pdf; content comes from resume.html).
[[redirects]]
  from = "/resume.pdf"
  to = "/resume.html"
  status = 200

# SPA fallback: serve the app for deep links like /blog/<slug> (client-side routed).
# Must come last so the specific rewrite above still wins.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# CRA fingerprints /static/* filenames, so they can be cached forever (immutable).
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
